<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="danfoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FBBF24" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Multimodal Route Lines intersecting -->
  <path d="M120 380 Q 220 280, 256 256 T 392 132" fill="none" stroke="url(#danfoGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M380 380 Q 280 280, 256 256 T 132 132" fill="none" stroke="url(#railGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Transit Hub Nodes -->
  <circle cx="120" cy="380" r="14" fill="#FBBF24"/>
  <circle cx="392" cy="132" r="14" fill="#FBBF24"/>
  <circle cx="380" cy="380" r="10" fill="#38BDF8"/>
  <circle cx="132" cy="132" r="10" fill="#38BDF8"/>
  
  <!-- Central Beacon Pin (Oshodi/Interchange) -->
  <circle cx="256" cy="256" r="32" fill="#FBBF24" filter="drop-shadow(0 0 16px rgba(245,158,11,0.5))"/>
  <circle cx="256" cy="256" r="16" fill="#0F172A"/>
  <circle cx="256" cy="256" r="6" fill="#FBBF24"/>
</svg>
